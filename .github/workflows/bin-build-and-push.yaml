name: build executables and push to GHCR

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        os: 
          - ubuntu-latest
          - windows-latest
        version:
          - '3.10'
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Executable Binary
        run: pyinstaller ./src/__main__.py --onefile -p ./src --add-data ./src/logging.conf:. --name emailer

      - name: Install ORAS CLI
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="1.1.0"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install/
          tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_${VERSION}_*.tar.gz oras-install/
      
      - name: Install ORAS CLI
        if: matrix.os == 'windows-latest'
        run: |
          Set-Variable -Name "VERSION" -Value "1.1.0"
          curl.exe -sLO  "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_windows_amd64.zip"
          tar.exe -xvzf oras_${VERSION}_windows_amd64.zip
          mkdir -p $env:HOMEPATH/.local/bin/
          copy oras.exe $env:HOMEPATH/.local/bin/
          "$env:HOMEPATH/.local/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          dir ./dist
                    
      - name: Log in to GitHub Container Registry
        run: |    
          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Convert Repository to Lowercase
        uses: vishalmamidi/lowercase-action@v1
        id: repository
        with:
          string: ${{ github.repository }}

      - name: Convert Runner Os to Lowercase
        uses: vishalmamidi/lowercase-action@v1
        id: os
        with:
          string: ${{ runner.os }}

      - name: Upload ${{ runner.os }} executables
        run: |
          oras push ghcr.io/${{ steps.repository.outputs.lowercase }}/emailer.${{ steps.os.outputs.lowercase }}:latest,${{ github.sha }} ./dist/emailer:application/vnd.prometejs.${{ steps.os.outputs.lowercase }}.bin

      - name: Logout from GitHub Container Registry
        run: oras logout ghcr.io
