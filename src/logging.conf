[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=myFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=myFormatter
args=(sys.stdout,)

[formatter_myFormatter]
format=%(asctime)s - %(processName)s:%(process)d - %(threadName)s:%(thread)d - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s
datefmt=